# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 1. Allocate more memory to the Gradle Daemon and optimize GC & Metaspace
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 2. Run builds and task execution in parallel across decoupled modules
org.gradle.parallel=true

# 3. Enable the Gradle build cache to reuse task outputs across runs
org.gradle.caching=true

# 4. Enable file system watching so Gradle doesn't re-index the whole drive on every sync
org.gradle.vfs.watch=true

# 5. Keep the Gradle Daemon alive in background for fast subsequent syncs and builds
org.gradle.daemon=true

# 6. Android performance optimizations
# Namespaces resource classes so Gradle only recompiles the resources that actually changed
android.nonTransitiveRClass=true
android.useAndroidX=true
